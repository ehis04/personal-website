# Keeps dependencies (and the checks that guard them) up to date. Each update arrives as a pull
# request, and the "Checks" workflow tells you whether it still builds before you merge it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions can break the site (Tailwind 4, for example, is a rewrite of the styling
    # setup), so they are upgraded deliberately, by hand. Security updates still arrive.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Newer releases dropped the LinkedIn logo (SiLinkedin) used on the Platforms page.
      - dependency-name: react-icons
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
